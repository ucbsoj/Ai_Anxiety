name: Deploy to GitHub Pages

on:
  # Automatically deploy whenever main changes
  push:
    branches:
      - main

  # Also allow manual deployment from the Actions tab
  workflow_dispatch:

# Permissions required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent multiple Pages deployments from stepping on each other
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # -----------------------------
  # Build the SvelteKit site
  # -----------------------------
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: sveltekit
          generator_config_file: ./my-app/svelte.config.js

      - name: Install dependencies
        working-directory: ./my-app
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build SvelteKit site
        working-directory: ./my-app
        env:
          CI: false
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./my-app/build

  # -----------------------------
  # Deploy the built site
  # -----------------------------
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
